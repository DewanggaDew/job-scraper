    - "waiter"
    - "waitress"
    - "barista"

# ============================================================
#  Scoring Weights & Thresholds
# ============================================================
scoring:
  weights:
    skills: 0.40
    seniority: 0.25
    recency: 0.20
    title: 0.15

  thresholds:
    strong: 75
    decent: 50

  notify_threshold: 75     # Only email jobs at or above this score
  max_job_age_days: 30     # Jobs older than this get recency_score = 0

  # Work-authorization multipliers applied to the overall score when a job is
  # in a country the candidate isn't authorised for (see candidate_profile.
  # work_authorization). Unknown countries (e.g. "Remote") are never penalised.
  work_auth:
    unauthorized_factor: 0.5          # in an unauthorised country, no sponsorship info
    no_sponsorship_factor: 0.2        # description explicitly rules out sponsorship
    sponsorship_available_factor: 0.95 # description offers sponsorship/relocation

# ============================================================
#  Scraping Behaviour
# ============================================================
scraping:
  max_jobs_per_source: 50   # Per-source cap. Lower = faster runs; the loop stops early once reached.
  max_runtime_seconds: 900  # Soft per-scraper budget (15m). Scraper returns partial results past this, before the 20m hard timeout kills it.
  delay_between_requests:
    # Most requests are API/HTTP calls, not full page loads — a short courtesy
    # delay is plenty. With ~50 jobs/source this is the single biggest driver of
    # wall-clock time, so keep it tight.
    min_seconds: 1
    max_seconds: 2
  headless: true           # Set false to debug scrapers visually

# ============================================================
#  Notification
# ============================================================
notification:
  # Actual email is set via NOTIFY_EMAIL environment variable / GitHub Secret
  send_decent_matches: true   # Include decent matches in email (not just strong)
  max_jobs_in_email: 15

