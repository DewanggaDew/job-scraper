    - "data engineer"
    - "machine learning"
    - "ml engineer"
    - "ai engineer"
    - "product manager"
    - "product owner"
    - "scrum master"
    - "technical program"
    - "it consultant"
    - "it specialist"
    - "it analyst"
    - "it project"
    - "it manager"
    - "it applications"
    - "business analyst"
    - "systems analyst"
    - "technical consultant"
    - "tech lead"
    - "tech consultant"
    - "solutions architect"
    - "application developer"
    - "applications developer"
    - "mobile developer"
    - "android developer"
    - "ios developer"
    - "qa engineer"
    - "quality assurance"
    - "test engineer"
    - "automation engineer"
    - "security engineer"
    - "cybersecurity"
    - "network engineer"
    - "infrastructure"
    - "platform engineer"
