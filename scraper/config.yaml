# ============================================================
#  LLM (Apply Assistant) — OpenAI-compatible chat endpoint
#  Provider-agnostic: change base_url/model/api_key_env to swap
#  providers (OpenRouter / Groq / Mistral …) without code edits.
# ============================================================
llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  model: "meta-llama/llama-3.3-70b-instruct:free"   # free tier; swap if throttled
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.4
  max_tokens: 1200

# ============================================================
#  Apply Assistant (ToS-safe — drafts, never auto-submits)
#  Generates a tailored cover letter + talking points per job
#  so you can review and apply yourself.
# ============================================================
apply_assistant:
  enabled: true
  policy: "both"                # "manual" (only queued_apply) | "auto" (strong matches) | "both"
  min_match_score: 75           # Draft for auto-policy jobs scoring >= this
  max_drafts_per_run: 10        # Cap LLM calls per run to stay within free-tier limits
  skip_unauthorized: true       # Don't draft for jobs likely needing visa sponsorship

# ============================================================
#  Contact Outreach — find people at target companies
#  (recruiters, talent acquisition, hiring managers, HR) so you
#  can reach out directly. Collects + drafts only; NEVER sends.
# ============================================================
contact_outreach:
  enabled: true
  target_min_score: 70          # Only chase companies with a match >= this score
  target_statuses:              # …or whose job you've moved into one of these
    - "saved"
    - "queued_apply"
    - "applied"
  target_roles:                 # Which people are worth collecting
    - "recruiter"
    - "talent_acquisition"
    - "hiring_manager"
    - "hr"
  max_companies_per_run: 10     # Hard cap on companies processed per run
  max_contacts_per_company: 3   # Hard cap on people kept per company
  sources:
    company_site: true          # Scrape the employer's own site (low risk)
    email_inference: true       # Guess emails from name + domain (MX-checked)
    linkedin: false             # ⚠️ Phase 3: violates LinkedIn ToS / ban risk. Opt-in only.
  email_inference:
    verify_mx: true             # Confirm the domain accepts mail (no SMTP probing)
  draft_messages: false         # Use the LLM to draft an outreach message per contact

